[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-feedback-analyzer"
version = "0.1.0"
description = "A feedback analyzer using FastAPI, Streamlit, and LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.8.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=0.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
]